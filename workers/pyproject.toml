[project]
name = "animarka-workers"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["animarka-api", "celery[redis]>=5.4"]

[tool.uv.sources]
animarka-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animarka_workers"]
