[project]
name = "animarka"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["api", "workers"]

[tool.uv.sources]
animarka-api = { workspace = true }
animarka-workers = { workspace = true }

[dependency-groups]
dev = ["animarka-api", "animarka-workers", "ruff>=0.8", "mypy>=1.13", "pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["api/src", "workers/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests", "workers/tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["animarka_core.queues", "animarka_workers.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
